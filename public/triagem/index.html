<style>
  :root {

    --nm-text: #e8e8e8;
    --nm-muted: #888;
    --nm-accent: #E8002D;
    --nm-success: #22c55e;
    --nm-warning: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--nm-dark);
    color: var(--nm-text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: var(--nm-gray);
    border-bottom: 1px solid var(--nm-border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo {
    width: 36px;
    height: 36px;
    background: var(--nm-red);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .header-info h1 { font-size: 15px; font-weight: 600; color: #fff; }
  .header-info p { font-size: 12px; color: var(--nm-muted); margin-top: 1px; }

  .progress-wrap {
    background: var(--nm-gray);
    border-bottom: 1px solid var(--nm-border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-bg { flex: 1; height: 3px; background: var(--nm-border); border-radius: 2px; }
  .progress-bar-fill { height: 3px; border-radius: 2px; background: var(--nm-red); transition: width 0.5s ease; }
  .progress-label { font-size: 11px; color: var(--nm-muted); white-space: nowrap; }

  .main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px 60px;
  }

  .chat-container { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 20px; }

  .msg { display: flex; gap: 12px; align-items: flex-start; animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 8px; background: var(--nm-red);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }

  .msg-avatar.user { background: #2a2a2a; font-size: 13px; }

  .msg-bubble {
    background: var(--nm-gray);
    border: 1px solid var(--nm-border);
    border-radius: 12px;
    border-top-left-radius: 4px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--nm-text);
    flex: 1;
  }

  .msg.user-msg { flex-direction: row-reverse; }
  .msg.user-msg .msg-bubble {
    background: #1e1e2e; border-color: #3a3a5a;
    border-radius: 12px; border-top-right-radius: 4px; color: #c8c8f0;
  }

  .input-area {
    background: var(--nm-gray);
    border: 1px solid var(--nm-border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-label { font-size: 11px; font-weight: 600; color: var(--nm-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  textarea {
    background: var(--nm-dark);
    border: 1px solid var(--nm-border);
    border-radius: 8px;
    color: var(--nm-text);
    font-size: 14px;
    font-family: inherit;
    padding: 12px;
    resize: vertical;
    min-height: 80px;
    width: 100%;
    transition: border-color 0.2s;
    line-height: 1.5;
  }

  textarea:focus { outline: none; border-color: var(--nm-red); }

  .options-grid { display: flex; flex-wrap: wrap; gap: 8px; }

  .option-btn {
    padding: 8px 14px; border-radius: 20px; border: 1px solid var(--nm-border);
    background: var(--nm-dark); color: var(--nm-text); font-size: 13px;
    cursor: pointer; transition: all 0.15s; font-family: inherit;

  .option-btn:hover { border-color: var(--nm-red); color: var(--nm-red); }
  .option-btn.selected { background: var(--nm-red); border-color: var(--nm-red); color: #fff; }

  .btn-send {
    padding: 11px 22px; background: var(--nm-red); color: #fff; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s; font-family: inherit; align-self: flex-end;

  .btn-send:hover { opacity: 0.88; }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  .result-card {
    background: var(--nm-gray);
    border: 1px solid var(--nm-border);
    border-radius: 12px;
    padding: 20px;

  .result-card.success { border-color: #22c55e40; background: #0f1f14; }
  .result-card.new-demand { border-color: #f59e0b40; background: #1f180a; }
  .result-card.trello-success { border-color: #3b82f640; background: #0a0f1f; }

  .result-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 12px;
  }

  .result-tag.green { background: #22c55e20; color: #22c55e; }
  .result-tag.yellow { background: #f59e0b20; color: #f59e0b; }
  .result-tag.blue { background: #3b82f620; color: #3b82f6; }

  .result-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .result-desc { font-size: 13px; color: var(--nm-muted); line-height: 1.6; margin-bottom: 16px; }

  .result-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--nm-red); color: #fff;
    text-decoration: none; border-radius: 8px; font-size: 13px;
    font-weight: 600; transition: opacity 0.15s;
  }

  .result-link:hover { opacity: 0.88; }

  .result-meta {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--nm-border);
    display: flex; gap: 16px; flex-wrap: wrap;
  }

  .result-meta-item { font-size: 12px; color: var(--nm-muted); }
  .result-meta-item strong { color: var(--nm-text); }

  .loading-dots { display: flex; gap: 4px; padding: 8px 0; }

  .loading-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--nm-muted); animation: bounce 1.2s infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .trello-preview {
    background: var(--nm-dark); border: 1px solid var(--nm-border);
    border-radius: 8px; padding: 14px; margin-top: 12px;
  }

  .trello-preview-title {
    font-size: 11px; font-weight: 600; color: var(--nm-muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
  }

  .trello-field { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  .trello-field-label { color: var(--nm-muted); min-width: 100px; flex-shrink: 0; }
  .trello-field-value { color: var(--nm-text); }

  .priority-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;
  }

  .priority-p0 { background: #ef444420; color: #ef4444; }
  .priority-p1 { background: #f59e0b20; color: #f59e0b; }
  .priority-p2 { background: #3b82f620; color: #3b82f6; }
  .priority-p3 { background: #71717a20; color: #71717a; }

  .btn-restart {
    padding: 8px 16px; background: transparent; color: var(--nm-muted);
    border: 1px solid var(--nm-border); border-radius: 8px; font-size: 13px;
    cursor: pointer; font-family: inherit; transition: all 0.15s; margin-top: 12px;
  }

  .btn-restart:hover { color: var(--nm-text); border-color: var(--nm-text); }

  @media (max-width: 480px) {
    .main { padding: 20px 12px 40px; }
    .header { padding: 14px 16px; }
  }
</style>

let state = {
  step: 0,
  respostas: {},
  painelEncontrado: null,
  prioridade: null,
  responsavel: null
};

const STEPS = [
  { id: 'identificacao' },
  { id: 'objetivo' },
  { id: 'tema' },
  { id: 'recorte' },
  { id: 'urgencia' },

  { id: 'complemento_responsavel' },

];

const TOTAL_STEPS = 8;

const container = document.getElementById('chatContainer');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');

function updateProgress(step, total) {
  const pct = Math.round((step / total) * 100);
  progressBar.style.width = pct + '%';
  progressLabel.textContent = `Etapa ${step} de ${total}`;
}

function addMessage(text, isUser = false, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const msg = document.createElement('div');
      msg.className = `msg ${isUser ? 'user-msg' : ''}`;
      msg.innerHTML = `
        <div class="msg-avatar ${isUser ? 'user' : ''}">
          ${isUser ? '👤' : '🤖'}
        </div>
        <div class="msg-bubble">${text}</div>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      resolve();
    }, delay);
  });
}

function addLoading() {
  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.id = 'loading-msg';
  msg.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
  return msg;
}

function removeLoading() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

function addInput(config) {
  const area = document.createElement('div');
  area.className = 'input-area';
  area.id = 'current-input';

  let html = `<div class="input-label">${config.label || 'Sua resposta'}</div>`;

  if (config.type === 'text') {
    html += `<textarea id="user-input" placeholder="${config.placeholder || ''}"></textarea>`;
  }

  if (config.type === 'options') {
    html += `<div class="options-grid">`;
    config.options.forEach(opt => {
      const val = (opt.value || opt).replace(/'/g, '&#39;');
      html += `<button class="option-btn" onclick="selectOption(this, '${val}')">${opt.label || opt}</button>`;
    });
    html += `</div>`;
  }

  if (config.type === 'options-text') {
    html += `<div class="options-grid">`;
    config.options.forEach(opt => {
      const val = (opt.value || opt).replace(/'/g, '&#39;');
      html += `<button class="option-btn" onclick="selectOption(this, '${val}')">${opt.label || opt}</button>`;
    });
    html += `</div>`;
    html += `<textarea id="user-input" placeholder="${config.placeholder || 'Ou descreva em suas palavras...'}" style="min-height:60px; margin-top:8px;"></textarea>`;
  }

  html += `<button class="btn-send" id="send-btn" onclick="handleSend()">Continuar →</button>`;

  area.innerHTML = html;
  container.appendChild(area);
  container.scrollTop = container.scrollHeight;

  const textarea = area.querySelector('textarea');
  if (textarea) {
    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) handleSend();
    });
  }
}

function selectOption(btn, value) {
  btn.closest('.options-grid').querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  btn.dataset.value = value;

  const area = document.getElementById('current-input');
  const hasTextarea = area && area.querySelector('textarea');
  if (!hasTextarea) {
    setTimeout(() => handleSend(), 200);
  }
}

function getCurrentValue() {
  const area = document.getElementById('current-input');
  if (!area) return null;

  const selected = area.querySelector('.option-btn.selected');
  const textarea = area.querySelector('textarea');

  if (selected && textarea) {
    return textarea.value.trim() || selected.dataset.value || selected.textContent.trim();
  }
  if (selected) {
    return selected.dataset.value || selected.textContent.trim();
  }
  if (textarea) {
    return textarea.value.trim();
  }
  return null;
}

function removeInput() {
  const el = document.getElementById('current-input');
  if (el) el.remove();
}

  removeInput();

  const stepId = STEPS[state.step]?.id;
  state.respostas[stepId] = value;
  state.step++;

  await processStep();
}

    await analyzeAndRoute();

  else if (stepId === 'complemento_responsavel') {
    if (!state.painelEncontrado) {
      await addMessage('Quem vai <strong>validar e aceitar</strong> essa entrega quando ficar pronta?', false, 400);
      addInput({
        type: 'options-text',
        label: 'Responsável pela validação',
        placeholder: 'Ex: Gerente regional do Piauí, ou eu mesmo...',
        options: [
          { label: 'Eu mesmo(a)', value: 'proprio_solicitante' },
          { label: 'Gerente regional', value: 'gerente_regional' },
          { label: 'Diretoria / Alex', value: 'diretoria' },
          { label: 'Comercial', value: 'comercial' },
        ]
      });
    } else {
      state.step++;
      await processStep();
    }
  }

  else if (stepId === 'complemento_prazo') {
    if (!state.painelEncontrado) {
      await addMessage('Tem alguma <strong>data crítica</strong> vinculada a isso? (reunião, fechamento, apresentação)', false, 400);
      addInput({
        type: 'options-text',
        label: 'Data crítica',
        placeholder: 'Ex: Reunião de resultados na sexta-feira...',
        options: [
          { label: 'Não tem data crítica', value: 'sem_data' },
          { label: 'Reunião ou apresentação', value: 'reuniao' },
          { label: 'Fechamento do mês', value: 'fechamento' },
          { label: 'Tomada de decisão comercial', value: 'decisao_comercial' },
        ]
      });
    } else {
      state.step++;
      await processStep();
    }
  }

  else if (stepId === 'resultado') {
    await showResult();
  }
}

async function analyzeAndRoute() {
  const loading = addLoading();

  const respostas = state.respostas;
  const paineisList = PAINEIS.map(p =>
    `ID: ${p.id} | Nome: ${p.nome} | Responde: ${p.perguntas_responde} | Temas: ${p.temas.join(', ')}`
  ).join('\n');

  const prompt = `Você é o assistente do Time de Inteligência Comercial do Novo Mundo, uma rede varejista brasileira com ~160 lojas.

Um colaborador fez uma solicitação com as seguintes respostas:
- Regional/Cargo: ${respostas.identificacao}
- Objetivo/Pergunta de negócio: ${respostas.objetivo}
- Tema: ${respostas.tema}
- Recorte: ${respostas.recorte}
- Urgência: ${respostas.urgencia}

Painéis disponíveis no repositório:
${paineisList}

Analise se algum painel existente já atende essa necessidade. Responda APENAS em JSON válido, sem markdown, sem explicações:

{
  "painel_encontrado": true ou false,
  "painel_id": "id do painel ou null",
  "confianca": "alta|media|baixa",
  "justificativa": "Explicação curta em português de por que esse painel atende (ou por que nenhum atende)",
  "responsavel_sugerido": "inacio|sidnei|joao",
  "tipo_demanda": "BI|Supply|Controladoria|Análise|Extração",
  "prioridade": "P0|P1|P2|P3"
}

Regras:
- Seja criterioso: só marque painel_encontrado=true se houver alta probabilidade de atender
- Supply e operação → sidnei; Controladoria, financeiro → joao; BI, dados, Tableau → inacio
- P0=hoje/urgente, P1=1-3 dias, P2=3-7 dias, P3=backlog`;

  try {
    const response = await fetch(CONFIG.CLAUDE_PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: CONFIG.CLAUDE_MODEL,
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    const text = data.content?.[0]?.text || '{}';
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);

    removeLoading();

    state.painelEncontrado = result.painel_encontrado ? PAINEIS.find(p => p.id === result.painel_id) : null;
    state.analise = result;
    state.prioridade = result.prioridade;
    state.responsavel = result.responsavel_sugerido;

    if (result.painel_encontrado && result.confianca !== 'baixa') {
      await addMessage(`✅ Encontrei um painel que já responde exatamente o que você precisa!<br><br><em>${result.justificativa}</em>`, false, 300);
    } else {
      await addMessage(`📋 Essa necessidade ainda não está coberta pelos painéis existentes. Vou registrar como nova demanda para o time.<br><br><em>${result.justificativa}</em>`, false, 300);
    }

    state.step++;
    await processStep();

  } catch (err) {
    removeLoading();
    state.painelEncontrado = null;
    state.analise = { responsavel_sugerido: 'inacio', prioridade: 'P2', tipo_demanda: 'BI' };
    state.prioridade = 'P2';
    state.responsavel = 'inacio';
    await addMessage('Não consegui acessar a análise automática. Vou registrar sua demanda manualmente.', false, 300);
    state.step++;
    await processStep();
  }
}

async function showResult() {
  if (state.painelEncontrado) {
    await showPainelFound();
  } else {
    await createTrelloCard();
  }
}

async function showPainelFound() {
  const painel = state.painelEncontrado;
  const card = document.createElement('div');
  card.className = 'result-card success';
  card.innerHTML = `
    <span class="result-tag green">✓ Painel existente</span>
    <div class="result-title">${painel.nome}</div>
    <div class="result-desc">${painel.descricao}</div>
    <a href="${painel.link}" target="_blank" class="result-link">
      📊 Acessar painel no Tableau →
    </a>
    <div class="result-meta">
      <div class="result-meta-item"><strong>Responsável técnico:</strong> ${painel.responsavel}</div>
      <div class="result-meta-item"><strong>Público:</strong> ${painel.publico_alvo.join(', ')}</div>
    </div>
    <button class="btn-restart" onclick="restart()">↩ Nova solicitação</button>
  `;
  container.appendChild(card);
  container.scrollTop = container.scrollHeight;
  updateProgress(TOTAL_STEPS, TOTAL_STEPS);
}

async function createTrelloCard() {
  const loading = addLoading();
  const respostas = state.respostas;
  const analise = state.analise || {};

  const responsavelMap = {
    'inacio': 'Inácio — BI Sênior',
    'sidnei': 'Sidnei — Supply & Operações',
    'joao': 'João Carlos — Controladoria'
  };

  const cardTitle = `${analise.tipo_demanda || 'BI'} — ${(respostas.objetivo || 'Nova demanda').substring(0, 60)}`;

  const cardDesc = `**Solicitante:** ${respostas.identificacao}

**Objetivo / Pergunta de negócio:**
${respostas.objetivo}

**Tema:** ${respostas.tema}
**Recorte:** ${respostas.recorte}
**Urgência declarada:** ${respostas.urgencia}

**Prioridade definida pelo sistema:** ${state.prioridade}
**Responsável sugerido:** ${responsavelMap[state.responsavel] || state.responsavel}

**Quem valida a entrega:** ${respostas.complemento_responsavel || 'Não informado'}
**Data crítica:** ${respostas.complemento_prazo || 'Não informada'}

---
*Demanda registrada automaticamente via Portal de Triagem do Departamento de Inteligência Comercial*`;

  try {
    // Buscar listas do board e encontrar "Entrada de Demandas" por nome
    const listsResp = await fetch(
      `https://api.trello.com/1/boards/${CONFIG.TRELLO_BOARD_ID}/lists?key=${CONFIG.TRELLO_KEY}&token=${CONFIG.TRELLO_TOKEN}`
    );
    const lists = await listsResp.json();

    let listId = CONFIG.TRELLO_LISTS.entrada;
    if (!listId) {
      const found = lists.find(l => l.name.toLowerCase().includes('entrada'));
      listId = found?.id || lists[0]?.id;
    }

    if (!listId) throw new Error('Lista não encontrada');

    const cardResp = await fetch('https://api.trello.com/1/cards', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: cardTitle,
        desc: cardDesc,
        idList: listId,
        key: CONFIG.TRELLO_KEY,
        token: CONFIG.TRELLO_TOKEN
      })
    });

    const card = await cardResp.json();
    removeLoading();

    const prioClass = `priority-${(state.prioridade || 'p2').toLowerCase()}`;

    const resultEl = document.createElement('div');
    resultEl.className = 'result-card trello-success';
    resultEl.innerHTML = `
      <span class="result-tag blue">✓ Card criado no Trello</span>
      <div class="result-title">Demanda registrada com sucesso!</div>
      <div class="result-desc">Sua solicitação foi enviada para a fila do Departamento de Inteligência. Em breve o time entrará em contato.</div>

      <div class="trello-preview">
        <div class="trello-preview-title">Resumo do card criado</div>
        <div class="trello-field">
          <span class="trello-field-label">Título:</span>
          <span class="trello-field-value">${cardTitle}</span>
        </div>
        <div class="trello-field">
          <span class="trello-field-label">Prioridade:</span>
          <span class="priority-badge ${prioClass}">${state.prioridade}</span>
        </div>
        <div class="trello-field">
          <span class="trello-field-label">Responsável:</span>
          <span class="trello-field-value">${responsavelMap[state.responsavel] || state.responsavel}</span>
        </div>
        <div class="trello-field">
          <span class="trello-field-label">Tipo:</span>
          <span class="trello-field-value">${analise.tipo_demanda || 'BI / Dados'}</span>
        </div>
        <div class="trello-field">
          <span class="trello-field-label">Link:</span>
          <a href="${card.shortUrl}" target="_blank" style="color: #3b82f6; font-size: 13px;">Ver card no Trello →</a>
        </div>
      </div>

      <button class="btn-restart" onclick="restart()">↩ Nova solicitação</button>
    `;
    container.appendChild(resultEl);

  } catch (err) {
    removeLoading();

    const resultEl = document.createElement('div');
    resultEl.className = 'result-card new-demand';
    resultEl.innerHTML = `
      <span class="result-tag yellow">⚠ Registre manualmente</span>
      <div class="result-title">Demanda qualificada — registre no Trello</div>
      <div class="result-desc">Não foi possível criar o card automaticamente. Use as informações abaixo para registrar no Trello.</div>

      <div class="trello-preview">
        <div class="trello-preview-title">Dados para o card</div>
        <div class="trello-field"><span class="trello-field-label">Título:</span><span class="trello-field-value">${cardTitle}</span></div>
        <div class="trello-field"><span class="trello-field-label">Prioridade:</span><span class="priority-badge priority-${(state.prioridade || 'p2').toLowerCase()}">${state.prioridade}</span></div>
        <div class="trello-field"><span class="trello-field-label">Responsável:</span><span class="trello-field-value">${responsavelMap[state.responsavel] || state.responsavel}</span></div>
        <div class="trello-field"><span class="trello-field-label">Solicitante:</span><span class="trello-field-value">${respostas.identificacao}</span></div>
        <div class="trello-field"><span class="trello-field-label">Objetivo:</span><span class="trello-field-value">${respostas.objetivo}</span></div>
      </div>

      <button class="btn-restart" onclick="restart()">↩ Nova solicitação</button>
    `;
    container.appendChild(resultEl);
  }

  container.scrollTop = container.scrollHeight;
  updateProgress(TOTAL_STEPS, TOTAL_STEPS);
}

function restart() {
  state = { step: 0, respostas: {}, painelEncontrado: null, prioridade: null, responsavel: null };
  container.innerHTML = '';
  updateProgress(0, TOTAL_STEPS);
  init();
}

async function init() {
  updateProgress(1, TOTAL_STEPS);

  await addMessage('Olá! 👋 Sou o assistente do <strong>Departamento de Inteligência Comercial</strong> do Novo Mundo.', false, 0);
  await addMessage('Vou fazer algumas perguntas rápidas para entender sua necessidade. Se o painel que você precisa já existir, te entrego o link direto. Se não existir, registro a demanda no nosso backlog.', false, 600);
  await addMessage('Pode começar: <strong>qual é a sua regional e cargo?</strong>', false, 1200);

  setTimeout(() => {
    addInput({
      type: 'options-text',
      label: 'Sua identificação',
      placeholder: 'Ex: Regional Goiânia, Gerente Comercial...',
      options: [
        { label: 'Regional Goiânia', value: 'Regional Goiânia' },
        { label: 'Regional Brasília', value: 'Regional Brasília' },
        { label: 'Regional Interior', value: 'Regional Interior' },
        { label: 'Regional Maranhão', value: 'Regional Maranhão' },
        { label: 'Regional Pará', value: 'Regional Pará' },
        { label: 'Regional Piauí', value: 'Regional Piauí' },
        { label: 'Televendas', value: 'Televendas' },
        { label: 'Matriz / Staff', value: 'Matriz' },
      ]
    });
  }, 1800);
}

init();
</script>
